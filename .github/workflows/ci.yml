name: ASTRA CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint and Syntax Check
      run: |
        python -m py_compile web/app.py web/database.py web/serial_bridge.py

    - name: Verify Database Initialization & Routes
      run: |
        cd web
        python -c "import database; database.init_db(); print('Database initialized successfully')"
        python -c "import app; client = app.app.test_client(); res = client.get('/'); assert res.status_code == 200; print('Root route verified 200 OK')"
        python -c "import app; client = app.app.test_client(); res = client.get('/api/telemetry/export.csv'); assert res.status_code == 200; print('CSV export route verified 200 OK')"
